name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip app
        run: zip Playlist-to-MP3.zip Start.bat app.ps1
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n\nDownload **Playlist-to-MP3.zip**, right-click it, choose Extract All, then run **Start.bat**.\n' "$MSG" > notes.md
          gh release create "v${{ github.run_number }}" Playlist-to-MP3.zip \
            --title "v${{ github.run_number }}" --notes-file notes.md --latest
