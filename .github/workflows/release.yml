name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same sources as Start.bat, bundled so users don't download anything on first run
      - name: Download tools
        run: |
          mkdir tools
          curl -L --fail -o tools/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          curl -L --fail -o deno.zip https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip
          unzip -j deno.zip deno.exe -d tools
          curl -L --fail -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -j ffmpeg.zip '*/bin/ffmpeg.exe' '*/bin/ffprobe.exe' -d tools
          ls -la tools
      - name: Zip app
        run: zip -r Playlist-to-MP3.zip Start.bat app.ps1 tools
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n\nDownload **Playlist-to-MP3.zip**, right-click it, choose Extract All, then run **Start.bat**.\n' "$MSG" > notes.md
          gh release create "v${{ github.run_number }}" Playlist-to-MP3.zip \
            --title "v${{ github.run_number }}" --notes-file notes.md --latest
      - name: Delete older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | grep -vx "v${{ github.run_number }}" \
            | xargs -r -n1 gh release delete --yes --cleanup-tag
